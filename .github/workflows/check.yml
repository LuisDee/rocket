# Adapted from discipline-kit/ci/github-actions.example.yml.
#
# Every action is pinned by commit SHA, not tag -- a tag is mutable, and this is
# the supply-chain equivalent of digest-pinning an image (REDLINES.md).
#
# There is no local mirror of these jobs by design. The only local hook is
# pre-push (task-trace + typecheck + tests); everything else runs here. That
# asymmetry is deliberate and recorded in docs/ci-gates.md.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Honesty guards -- stdlib python3 only, no install step.
  # -------------------------------------------------------------------------

  gate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_gate_ledger.py

  task-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the check needs history, not a shallow clone
      - run: |
          python3 scripts/check_task_trace.py \
            --range "origin/${{ github.event.repository.default_branch }}..HEAD"

  guard-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Proves each guard still catches its violation, rather than merely running.
      # A broken guard looks exactly like a clean repo.
      - run: python3 scripts/test_guards.py

  # Rocket reads Strava through the official MCP connector and by no other
  # route, and may not upload to it at all (API Policy 2026, 5.3 and 3.5).
  # A prose constraint would not survive contact: the upload is four lines of
  # fetch and it makes a real feature work.
  no-strava-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_no_strava_api.py

  # -------------------------------------------------------------------------
  # Stack gates.
  # -------------------------------------------------------------------------

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --check, not --write: a hook that rewrites files cannot fail, so the
      # formatter needs its checking variant somewhere or it gates nothing.
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  # The append-only guards are a property of the DATABASE, not of application
  # code, so nothing above this job can see them. It runs the real migrations
  # against a real Postgres and then asserts on SQLSTATE.
  #
  # The image is pinned by DIGEST, not by tag (REDLINES.md). The discipline
  # kit's own example tag-pins its service container, contradicting its own
  # rule; that part was deliberately not copied.
  #
  # `POSTGRES_HOST_AUTH_METHOD: trust` rather than a password, so no credential
  # -- not even a throwaway one -- appears in a committed file.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280 # postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rocket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI database: one host, so both URLs are the same. Against
      # Neon they are not, and mixing them up is the classic failure.
      DATABASE_URL: postgres://postgres@localhost:5432/rocket
      DATABASE_URL_UNPOOLED: postgres://postgres@localhost:5432/rocket
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # No skipIf anywhere in this suite: globalSetup THROWS on a missing
      # DATABASE_URL, so a misconfigured job is red rather than green-and-empty.
      - run: npm run test:integration

  # Renders every route in a real browser at phone width and measures four
  # things the gates above are blind to: horizontal overflow, text the same
  # colour as what is behind it, tap targets under 44px, and console errors.
  # typecheck, lint, format and the vitest suite never render a page, and three
  # defects have shipped through all of them.
  #
  # A production build, on its own port and its own distDir, never a dev server:
  # the sweep has to measure what actually ships, and `next dev` streams HMR
  # websocket failures into the console check.
  #
  # Same digest-pinned Postgres as `integration`, and the same reason. It also
  # plants one ingest row per interesting status, because `/activities` lists
  # only the pending queue -- the shipped approval screen is reachable by direct
  # URL alone and would otherwise never be measured.
  viewport:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280 # postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rocket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/rocket
      DATABASE_URL_UNPOOLED: postgres://postgres@localhost:5432/rocket
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      # Refuses to run against a non-local host, so it cannot touch Neon.
      - run: node e2e/fixtures.mts
      - run: npm run test:viewport
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: viewport-traces
          path: test-results/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7

  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
      # The Garmin harness holds the project's silent-failure path: an MFA code
      # that never reaches the library, which fails invisibly in production.
      # The Strava half of this comment described a harness withdrawn on
      # 2026-09-07; only Garmin runs here.
      - run: uv run --directory tools/garmin_probe pytest -q
